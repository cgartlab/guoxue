name: Bug 报告
description: 报告国学课堂站点的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: 课程 / 页面 URL
      description: 出问题的页面完整地址（如 https://guoxue.8023laozhanshi.cc/lessons/01-lunyu/）
      placeholder: https://guoxue.8023laozhanshi.cc/...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与浏览器
      description: 例如 "Windows 11 + Chrome 120" 或 "iPad + Safari"
      placeholder: 设备 / 浏览器 / 分辨率
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 应该发生什么？
      placeholder: 描述预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？附截图或控制台报错更好。
      placeholder: 描述实际结果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何复现？
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: false
